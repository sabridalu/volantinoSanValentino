
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabrina's Bakery - San Valentino 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --elegant-pink: #fffafa;
            --soft-rose: #fce4e4;
            --accent-pink: #d4a5a5;
            --deep-rose: #8a6d6d;
            --text-main: #4a3a3a;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--elegant-pink);
            color: var(--text-main);
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-accent { font-family: 'Cormorant Garamond', serif; }
        
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ottimizzazione per scroll su mobile */
        section {
            overflow: hidden;
        }

        /* Pulsanti touch-friendly */
        button, a {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
